[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "material-collager"
version = "0.1.0"
description = "High-end material collage board generator using direct OpenAI image references."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0.0",
]

[project.scripts]
material-collager = "material_collager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/material_collager"]

