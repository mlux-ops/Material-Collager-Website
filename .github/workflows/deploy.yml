name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # wrangler.jsonc carries a placeholder D1 database_id so local dev works
      # without account access; swap in the real id (looked up by name) in the
      # built deploy config (dist/server/wrangler.json) before deploying.
      - name: Resolve D1 database id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => raw += chunk);
            process.stdin.on('end', () => {
              const rows = JSON.parse(raw);
              const row = rows.find((entry) => entry.name === 'material-collager-db');
              if (!row) { console.error('D1 database material-collager-db not found'); process.exit(1); }
              console.log(row.uuid);
            });
          ")
          echo "Resolved material-collager-db -> $DB_ID"
          grep -rl "00000000-0000-4000-8000-000000000000" wrangler.jsonc dist | while read -r file; do
            sed -i "s/00000000-0000-4000-8000-000000000000/$DB_ID/" "$file"
            echo "Patched $file"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secrets can be managed from GitHub as well as the dashboard: a
      # repository secret named SMARTSHEET_ACCESS_TOKEN is pushed to the Worker
      # after every deploy (so rotating it is a repository-secret edit plus a
      # deploy), and skipped when the repository has none. The value is piped,
      # never echoed; `wrangler secret list` prints names and types only, so
      # this log always shows which secrets the live Worker holds.
      - name: Sync Worker secrets
        run: |
          if [ -n "$SMARTSHEET_ACCESS_TOKEN" ]; then
            printf '%s' "$SMARTSHEET_ACCESS_TOKEN" | npx wrangler secret put SMARTSHEET_ACCESS_TOKEN
            echo "Set SMARTSHEET_ACCESS_TOKEN from the repository secret"
          else
            echo "No SMARTSHEET_ACCESS_TOKEN repository secret; leaving the Worker's secrets as they are"
          fi
          echo "Secrets on the Worker now:"
          npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
