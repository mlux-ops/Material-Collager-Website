name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  # Runs on every pull request and before every deploy. A red test, a lint
  # error or a NEW type error stops the deploy; pre-existing type errors are
  # allowed up to scripts/typecheck-baseline.json.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:transitions

      - name: Typecheck (no new errors)
        run: node scripts/typecheck-baseline.mjs

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    # Moved here from the workflow level so pull-request verify runs never
    # queue behind (or hold up) a production deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # wrangler.jsonc carries a placeholder D1 database_id so local dev works
      # without account access; swap in the real id (looked up by name) in the
      # built deploy config (dist/server/wrangler.json) before deploying.
      - name: Resolve D1 database id
        run: |
          DB_ID=$(npx wrangler d1 list --json | node -e "
            let raw = '';
            process.stdin.on('data', (chunk) => raw += chunk);
            process.stdin.on('end', () => {
              const rows = JSON.parse(raw);
              const row = rows.find((entry) => entry.name === 'material-collager-db');
              if (!row) { console.error('D1 database material-collager-db not found'); process.exit(1); }
              console.log(row.uuid);
            });
          ")
          echo "Resolved material-collager-db -> $DB_ID"
          grep -rl "00000000-0000-4000-8000-000000000000" wrangler.jsonc dist | while read -r file; do
            sed -i "s/00000000-0000-4000-8000-000000000000/$DB_ID/" "$file"
            echo "Patched $file"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Smartsheet token is a Secrets Store binding (wrangler.jsonc), so
      # nothing is pushed here. `wrangler secret list` prints the Worker's own
      # secrets — names and types only — so every deploy log records what the
      # live Worker holds.
      - name: List Worker secrets
        run: npx wrangler secret list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
